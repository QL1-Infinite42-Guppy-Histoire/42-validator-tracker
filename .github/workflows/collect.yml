# 42 Validator Tracker — zero-cost collector runner (LIVE)
#
# Cost premise: running cost must stay ¥0.
#  - This repo will be PUBLIC, so GitHub Actions minutes are free & unlimited.
#  - Schedule: every 5 minutes is GitHub's minimum cron interval for Actions
#    (runs can be delayed under load — the site shows the last processed block
#    and timestamp, so any delay is visible, not hidden). With a ~5.4s block
#    time, one run processes roughly 55 blocks; the collector checkpoints via
#    state.json, so a delayed/skipped run just means the next run catches up.
#  - Serving: GitHub Pages (free) from the main branch root. Enable it once in
#    Settings -> Pages -> "Deploy from a branch" -> main / (root). index.html,
#    feed.json and watchlist.json are then served as static files.
#
# How it works: each run checks out the repo (state.json / events.jsonl /
# feed.json are committed data), runs `node collector.mjs --once` to process
# blocks newer than the checkpoint, and commits the updated data files back.
#
# Notes / caveats:
#  - Do NOT add a watchlist-rebuild step here: build-watchlist.mjs and
#    build-estimates.mjs read the research data in ~/workspace/42-flowmap
#    etc., which does not exist in the Actions runner. watchlist.json /
#    registries.json are committed artifacts; regenerate them locally and
#    commit when the research data changes. (v0.3.0: the collector's own
#    validator auto-refresh CAN run here — it only needs the chain RPC —
#    and any watchlist.json change it makes is committed back below.)
#  - Scheduled workflows run only on the default branch and can be disabled by
#    GitHub after 60 days without repository activity (the data commits from
#    this workflow themselves count as activity).
#  - concurrency prevents two runs from racing on the commit-back push.
name: collect

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect new blocks
        run: node collector.mjs --once

      - name: Commit updated data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in feed.json events.jsonl state.json pairs-cache.json pairs-creation.json watchlist.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: collector update $(date -u +%FT%TZ)"
            git push
          fi
